name: RouterOS image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

# One run per ref at a time. A newer push supersedes the run it interrupted;
# a tag does not — a tagged build publishes one specific version and nothing
# should quietly cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so `git describe` resolves a release tag rather
          # than falling back to a bare short SHA.
          fetch-depth: 0
      # `.dockerignore` excludes `.git`, so build.rs cannot describe the version
      # itself inside the builder — resolve it here and pass it in. No `--dirty`:
      # a fresh checkout is always clean, and a stray mode/EOL difference would
      # otherwise brand a release image `-dirty`.
      - name: Resolve build version
        id: version
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      # No qemu: the Dockerfile builder is pinned to the native platform and zig
      # cross-compiles both musl targets, so the arm64 image needs no emulation.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=routeros-arm64,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build, publish, and export Docker archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            GIT_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          outputs: |
            type=image,push=true,oci-mediatypes=false
            type=docker,dest=${{ runner.temp }}/noadd-mikrotik-routeros-arm64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify RouterOS-compatible manifest
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          media_type="$(docker buildx imagetools inspect \
            --raw ghcr.io/${{ github.repository }}:routeros-arm64 \
            | jq -r '.mediaType')"
          test "${media_type}" = "application/vnd.docker.distribution.manifest.v2+json"

      - name: Upload RouterOS Docker archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noadd-mikrotik-routeros-arm64
          path: ${{ runner.temp }}/noadd-mikrotik-routeros-arm64.tar
          compression-level: 0
          retention-days: 7
